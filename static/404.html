<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>页面没有找到 | Clipboard</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 82% 12%, rgba(189, 79, 51, 0.14), transparent 25rem), #f7f5f0;
        color: #22211f;
        font-family: "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      main { width: min(100%, 720px); }
      .brand { margin: 0 0 72px; font: 600 22px Georgia, "Songti SC", serif; }
      .code { margin: 0 0 20px; color: #bd4f33; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; }
      h1 { margin: 0 0 24px; font: 500 clamp(52px, 10vw, 92px)/0.98 Georgia, "Songti SC", serif; letter-spacing: -0.05em; }
      p { max-width: 560px; margin: 0 0 34px; color: #68645f; font-size: 17px; line-height: 1.75; }
      nav { display: flex; flex-wrap: wrap; gap: 16px 26px; }
      a { color: inherit; font-weight: 700; text-underline-offset: 5px; }
      a:first-child { padding: 13px 18px; border-radius: 10px; background: #bd4f33; color: #fffaf4; text-decoration: none; }
      @media (prefers-color-scheme: dark) {
        body { background: radial-gradient(circle at 82% 12%, rgba(205, 96, 65, 0.1), transparent 25rem), #201f1d; color: #f1eee8; }
        p { color: #bdb7af; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Clipboard</p>
      <p class="code">404 / PAGE NOT FOUND</p>
      <h1>这段内容，<br />没有被保存。</h1>
      <p>地址可能已经变化，或者你复制的链接不完整。回到官网继续，产品和安装包都还在。</p>
      <nav aria-label="继续浏览">
        <a href="/website/">返回官网</a>
        <a href="/website/guides/windows-clipboard-history/">查看使用指南</a>
        <a href="https://github.com/hhrsc/clipboard/releases/tag/v0.1.0">前往下载页</a>
      </nav>
    </main>
  </body>
</html>
